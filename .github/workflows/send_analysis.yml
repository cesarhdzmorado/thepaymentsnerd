name: Send Analysis Email

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'Analysis markdown filename (e.g. my-report.md)'
        required: true
        type: string

jobs:
  send-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Validate input
        run: |
          FILENAME="${{ github.event.inputs.filename }}"
          echo "Analysis file: $FILENAME"

          # Basic validation
          if [ -z "$FILENAME" ]; then
            echo "ERROR: filename is required"
            exit 1
          fi

          # Check it ends with .md
          if [[ ! "$FILENAME" =~ \.md$ ]]; then
            echo "ERROR: filename must end with .md"
            exit 1
          fi

      - name: Send analysis email via API
        run: |
          echo "================================================"
          echo "Sending analysis: ${{ github.event.inputs.filename }}"
          echo "================================================"

          SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "ERROR: Required secrets not configured"
            exit 1
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"filename\":\"${{ github.event.inputs.filename }}\"}" \
            "$SITE_URL/api/send-analysis")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" -eq 200 ]; then
            echo ""
            echo "Analysis sent successfully!"
            echo "$body" | jq -r '"Sent to \(.sent) of \(.total) subscribers"' 2>/dev/null || echo "$body"
          else
            echo ""
            echo "Failed to send analysis (HTTP $http_code)"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "================================================"
          echo "SUMMARY"
          echo "================================================"
          echo "File: ${{ github.event.inputs.filename }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Date: $(date -u)"

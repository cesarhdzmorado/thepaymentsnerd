name: GPT-6 Migration Canary

on:
  pull_request:
    branches: [main]
    paths:
      - "ai/**"
      - "web/lib/emailTemplate.ts"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/model_migration_canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    # Match the production newsletter runner. ubuntu-latest moved to 26.04
    # and cannot build pyreqwest-impersonate's BoringSSL dependency.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect model-pipeline changes
        id: model_pipeline
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$changed_files"
          if grep -Eq '^(ai/src/|ai/scripts/model_canary\.py$|ai/requirements\.txt$|web/lib/emailTemplate\.ts$|web/package(-lock)?\.json$|\.github/workflows/model_migration_canary\.yml$)' <<< "$changed_files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ai/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s ai/tests -v

      - name: Run no-publish model canary
        if: steps.model_pipeline.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m ai.scripts.model_canary

      - name: Generate complete no-publish edition
        if: steps.model_pipeline.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # Read-only public key: this step runs PR code, so it must never get
          # the service-role key. Without this secret, dedup is skipped.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TPN_USAGE_PATH: ai/output/full_edition_usage.json
        run: |
          python -m ai.src.main
          cp web/public/newsletter.json ai/output/full_edition.json

      - name: Upload model canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-canary-${{ github.run_id }}
          path: ai/output/
          if-no-files-found: warn
          retention-days: 30

# ============================================================================
# CURRENT INDUSTRY TRENDS
# ============================================================================
# These provide context to agents for better story selection and analysis.
# Trends are sorted by weight (highest first) for readability; the agent
# also sorts by weight before injecting into the prompt.
#
# WEIGHT RUBRIC (calibrate against this — don't grade-inflate):
#   10 = redefining the industry RIGHT NOW (max 1 trend at a time)
#    8 = top-of-mind for every payments operator (max 3 trends)
#    7 = important context, watching closely (max 5 trends)
#    6 = on the radar, real but not central (no cap)
#    5 = background trend, lower editorial heat
#    1-4 = sunsetting / archival
#
# REQUIRED FIELDS per trend:
#   name, weight, description, signals, companies_to_watch, watch_for,
#   last_reviewed (YYYY-MM-DD), added (YYYY-MM-DD), status (active|sunsetting|archived)
#
# SIGNALS RULE: keep each signal to ≤4 words. Long descriptive phrases
# ("declining guest checkout preference") will not regex-match news copy
# and dilute attention in the agent prompt. Use short keywords that
# actually appear in articles.
#
# CHANGE PROCEDURE: any edit to current_trends MUST include
# `trend_diff.py` output in the PR description. Run:
#   python ai/scripts/trend_diff.py --old git:main --new ai/config.yml
# ============================================================================
current_trends:
  - name: "Digital Wallet Ascendancy"
    weight: 8
    last_reviewed: "2026-04-26"
    added: "2026-04-26"
    status: active
    description: "Digital wallets are displacing traditional checkout methods such as guest checkout and saved card credentials. PayPal remains the dominant wallet but competition is intensifying from Apple Pay, Cash App, and Google Pay. Guest checkout preference is declining, indicating deeper wallet penetration and growing consumer comfort with embedded payment solutions."
    signals:
      - "digital wallet"
      - "guest checkout"
      - "wallet on file"
      - "card on file"
      - "one-click checkout"
      - "Apple Pay"
      - "Google Pay"
      - "Cash App"
      - "Revolut Pay"
      - "wallet adoption"
    companies_to_watch:
      - "PayPal"
      - "Apple Pay"
      - "Google Pay"
      - "Cash App"
      - "Revolut Pay"
    watch_for: "Shifts in merchant adoption rates across wallet providers; whether Apple Pay or Google Pay can erode PayPal's dominant share; expansions of Revolut Pay's one-click checkout into new geographies; declining guest-checkout preference as a leading indicator of wallet penetration."

  - name: "Regulatory Harmonization and Banking Licensing"
    weight: 8
    last_reviewed: "2026-04-26"
    added: "2026-04-26"
    status: active
    description: "Fintechs are increasingly pursuing full banking licenses as they expand from point solutions into deposits, lending, and broader financial services. Regulators globally are tightening oversight, requiring fintechs to meet the same capital, reserve, and cybersecurity standards as incumbents. This is creating a more level playing field but also raising the cost of doing business for digital challengers."
    signals:
      - "banking license"
      - "OCC approval"
      - "bank charter"
      - "FCA"
      - "PSD2"
      - "consumer duty"
      - "capital requirements"
      - "fintech regulation"
      - "compliance costs"
      - "regulatory scrutiny"
    companies_to_watch:
      - "Nubank"
      - "Revolut"
      - "Plata"
      - "Klar"
      - "Ualá"
      - "Mercado Pago"
    watch_for: "Speed of regulatory approvals in key markets (US, UK, EU); Nubank's conditional OCC approval and other US bank charter pursuits; whether rising compliance costs slow fintech growth or trigger consolidation; incumbent banks' digital transformation progress."

  - name: "Stablecoins, Mainstreaming & Tokenization"
    weight: 7
    last_reviewed: "2026-04-26"
    added: "2026-04-26"
    status: active
    description: "Stablecoins are crossing from crypto-native infrastructure into mainstream payment rails, particularly for cross-border settlement, B2B treasury, and merchant payouts. PYUSD, USDC, and bank-issued stablecoins are gaining institutional adoption alongside regulatory clarity (MiCA in EU, GENIUS Act discussions in US). Tokenized deposits and programmable money are moving from pilots to production at JPMorgan, BofA, and global banks."
    signals:
      - "stablecoin"
      - "USDC"
      - "PYUSD"
      - "USDT"
      - "MiCA"
      - "tokenized deposits"
      - "programmable money"
      - "on-chain settlement"
      - "JPM Coin"
      - "stablecoin payments"
    companies_to_watch:
      - "Circle"
      - "PayPal (PYUSD)"
      - "Stripe"
      - "Ripple"
      - "Paxos"
      - "JPMorgan (JPM Coin)"
      - "Visa"
      - "Mastercard"
    watch_for: "Bank-issued stablecoin launches; regulatory clarity in the US (GENIUS Act, OCC guidance); MiCA enforcement effects in the EU; payment processors integrating stablecoin rails for B2B and cross-border; institutional treasury use cases."

  - name: "Super-App Convergence"
    weight: 7
    last_reviewed: "2026-04-26"
    added: "2026-04-26"
    status: active
    description: "Fintechs like Revolut are aggressively pursuing the 'super-app' model, consolidating fragmented financial behaviors — payments, banking, investing, insurance, travel, and loyalty — into a single platform. While consumer demand signals are strong, no Western fintech has yet replicated the success of WeChat or Alipay. Big tech companies (Apple, Google, Amazon, Meta) are embedding financial services at the point of engagement, which could pressure standalone neobank models."
    signals:
      - "super app"
      - "super-app"
      - "RevPoints"
      - "neobank"
      - "WeChat"
      - "Alipay"
      - "single-app banking"
      - "embedded finance"
      - "loyalty program"
      - "AIR assistant"
    companies_to_watch:
      - "Revolut"
      - "Nubank"
      - "WeChat Pay"
      - "Alipay"
      - "Apple"
      - "Google"
      - "Amazon"
      - "Meta"
    watch_for: "Whether any Western fintech can durably replicate the Asian super-app model; big tech's continued embedding of financial services at the point of engagement; pressure on standalone neobank models as bundling intensifies; Revolut's expansion into investing, insurance, and AI assistants (AIR)."

  - name: "Open Banking and Embedded Finance Infrastructure"
    weight: 7
    last_reviewed: "2026-04-26"
    added: "2026-04-26"
    status: active
    description: "Open banking regulations, particularly Europe's PSD2, have enabled fintechs to securely access customer accounts and initiate payments, fueling rapid product innovation. Fintechs are leveraging API-first platforms and partnerships with card networks (Visa, Mastercard), open banking providers (Plaid, TrueLayer, Yapily), and embedded payments infrastructure (Currencycloud) to deliver seamless cross-border payments, multi-currency accounts, and instant financial services."
    signals:
      - "open banking"
      - "open finance"
      - "PSD2"
      - "embedded finance"
      - "embedded payments"
      - "API banking"
      - "financial APIs"
      - "account aggregation"
      - "CFPB 1033"
      - "data portability"
    companies_to_watch:
      - "Plaid"
      - "TrueLayer"
      - "Yapily"
      - "Currencycloud"
      - "Visa"
      - "Mastercard"
      - "Stripe Financial Connections"
      - "Tink"
    watch_for: "Evolution of open banking regulation beyond PSD2; CFPB 1033 implementation in the US; consolidation among open banking providers; whether embedded finance infrastructure becomes commoditized or remains a defensible layer."

  - name: "Enterprise Payments Platform Expansion"
    weight: 7
    last_reviewed: "2026-04-26"
    added: "2026-04-26"
    status: active
    description: "Enterprise payment processors like Adyen are expanding their offerings beyond merchant acquiring into issuing, capital lending, and accounts for SME customers. Fintechs like Revolut compete with digital processors (Stripe, PayPal, Adyen, Checkout.com) by offering flexible routing, broad local payment method coverage, and integrated POS solutions. Traditional acquirers and global banks also remain significant in the B2B payment processing ecosystem."
    signals:
      - "merchant acquiring"
      - "payment processor"
      - "POS terminal"
      - "card issuing"
      - "SME payments"
      - "B2B payments"
      - "payment orchestration"
      - "merchant services"
      - "Adyen"
      - "Checkout.com"
    companies_to_watch:
      - "Adyen"
      - "Stripe"
      - "PayPal"
      - "Checkout.com"
      - "Worldpay"
      - "Revolut"
      - "Nasdaq (FinTech segment)"
    watch_for: "Adyen guidance for ~20% sales growth and expansion into issuing/capital; Revolut launching POS apps and terminals; whether Stripe and Adyen can maintain premium growth as competition intensifies; Nasdaq FinTech ARR as a barometer for capital markets tech demand."

  - name: "Buy Now, Pay Later (BNPL) Maturation"
    weight: 6
    last_reviewed: "2026-04-26"
    added: "2026-04-26"
    status: active
    description: "BNPL has moved past the hypergrowth phase and is now stabilizing, with consumers increasingly engaging with longer-duration installment plans rather than short-term pay-in-four products. Product awareness improvements are expected to drive future adoption, particularly among lower-income demographics. Banks are increasingly securitizing loans from BNPL originators."
    signals:
      - "BNPL"
      - "buy now pay later"
      - "pay in four"
      - "installment plan"
      - "Affirm"
      - "Klarna"
      - "Afterpay"
      - "BNPL securitization"
      - "BNPL regulation"
      - "checkout financing"
    companies_to_watch:
      - "PayPal"
      - "Afterpay"
      - "Affirm"
      - "Klarna"
    watch_for: "Regulatory scrutiny on BNPL credit risk; whether longer-duration BNPL products lead to higher default rates; competitive dynamics as PayPal leverages wallet dominance to cross-sell BNPL; PayPal maintaining BNPL leadership against Afterpay and Affirm."

  - name: "Latin American Fintech Battleground"
    weight: 6
    last_reviewed: "2026-04-26"
    added: "2026-04-26"
    status: active
    description: "Latin America has become a key battleground for fintech expansion. In Mexico, intense competition among Nubank, Mercado Pago, Revolut, Klar, and Ualá is driving rising customer acquisition costs and richer incentives such as cashback and no-interest installments. Incumbent banks are responding by focusing on middle- and high-income segments while fintechs target retail and lower-income customers."
    signals:
      - "Latin America"
      - "Mexico fintech"
      - "Brazil fintech"
      - "Nubank"
      - "Mercado Pago"
      - "Plata"
      - "Klar"
      - "Ualá"
      - "LatAm payments"
      - "neobank LATAM"
    companies_to_watch:
      - "Nubank"
      - "Mercado Pago"
      - "Plata"
      - "Revolut"
      - "Klar"
      - "Ualá"
    watch_for: "Plata's $405M Series C and $5B valuation milestone; whether rising acquisition costs compress margins and force consolidation; Revolut's traction against deeply entrenched local players; regulatory developments in Mexico and Brazil that could reshape the competitive landscape."

  - name: "The Trust-Satisfaction Gap"
    weight: 6
    last_reviewed: "2026-04-26"
    added: "2026-04-26"
    status: active
    description: "Neobanks consistently outperform incumbents on customer satisfaction metrics, driven by lower fees, clearer terms, and easier onboarding. However, incumbents retain significant advantages in trust, perceived security, and product breadth — which remain key hurdles for neobanks seeking to become the primary financial relationship. Most consumers maintain relationships with two or more providers, indicating neobank accounts often complement rather than replace incumbents."
    signals:
      - "neobank"
      - "customer satisfaction"
      - "primary banking"
      - "deposit insurance"
      - "trust gap"
      - "challenger bank"
      - "Chime"
      - "Monzo"
      - "N26"
      - "fintech adoption"
    companies_to_watch:
      - "Revolut"
      - "Nubank"
      - "Chime"
      - "Monzo"
      - "N26"
      - "JPMorgan Chase"
      - "Bank of America"
      - "HSBC"
    watch_for: "Whether neobanks can close the trust gap through banking licenses and deposit insurance; shifts in primary account designation from incumbents to neobanks; incumbent digital transformation efforts that narrow the satisfaction gap; ~78% US fintech app penetration plateau or expansion."

  - name: "AI Integration in Fintech"
    weight: 5
    last_reviewed: "2026-04-26"
    added: "2026-04-26"
    status: active
    description: "Fintechs are deploying AI-powered assistants and tools to enhance customer experience and operational efficiency. Revolut's AIR assistant helps customers manage cards, subscriptions, investments, budgets, and travel essentials through conversational chat. More broadly, AI is being used for fraud detection, credit underwriting, and personalized financial recommendations. NOTE: AI is intentionally weighted at 5 (below mid) as a corrective lens — prior agent prompts over-indexed on AI/agentic commerce coverage. This weight reflects that AI is one of many forces reshaping fintech, not the dominant one."
    signals:
      - "AI assistant"
      - "AI agent"
      - "agentic AI"
      - "AI fraud"
      - "machine learning"
      - "AI underwriting"
      - "conversational AI"
      - "AI chatbot"
      - "fintech AI"
      - "AIR assistant"
    companies_to_watch:
      - "Revolut (AIR)"
      - "Nubank"
      - "PayPal"
      - "Stripe"
      - "Adyen"
    watch_for: "Consumer adoption rates of AI-powered financial assistants; whether AI meaningfully reduces customer acquisition and servicing costs; regulatory frameworks for AI in financial services; agentic commerce protocols (ACP, MCP) reaching production scale."

  - name: "Real-Time Payments and Cross-Border Rails"
    weight: 5
    last_reviewed: "2026-04-26"
    added: "2026-04-26"
    status: active
    description: "Real-time payment rails (FedNow, RTP, SEPA Instant, PIX, UPI) are becoming baseline infrastructure, shifting competition to value-added overlays such as request-to-pay, liquidity management, and multi-rail orchestration. Cross-border payments are being re-architected for speed and FX transparency, with ISO 20022 migration, virtual accounts, and stablecoin corridors challenging legacy correspondent banking."
    signals:
      - "FedNow"
      - "RTP"
      - "SEPA Instant"
      - "PIX"
      - "ISO 20022"
      - "request to pay"
      - "cross-border payments"
      - "correspondent banking"
      - "instant settlement"
      - "SWIFT gpi"
    companies_to_watch:
      - "The Clearing House (RTP)"
      - "Federal Reserve (FedNow)"
      - "Wise"
      - "Airwallex"
      - "Nium"
      - "Thunes"
      - "SWIFT"
      - "J.P. Morgan"
      - "Form3"
    watch_for: "Bank adoption of FedNow/RTP; request-to-pay rollouts; ISO 20022 migration milestones; new cross-border corridors via stablecoin or alternative rails; embedded FX in B2B platforms; SWIFT alternatives gaining traction."

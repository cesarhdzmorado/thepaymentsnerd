# Model routing is role-based so editorial quality can be evaluated separately
# from bounded extraction work. Every value can be overridden without a code
# change via TPN_<ROLE>_MODEL and TPN_<ROLE>_REASONING_EFFORT.
models:
  researcher:
    name: "gpt-6.1-sol"
    reasoning_effort: "medium"
  writer:
    name: "gpt-6.1-sol"
    reasoning_effort: "medium"
  editor:
    name: "gpt-6.1-sol"
    reasoning_effort: "medium"
  utility:
    name: "gpt-6-luna"
    reasoning_effort: "none"

# Applied only after articles have been clustered into the same underlying event.
# A lower tier number wins. This is deliberately not a global story-ranking score:
# specialist outlets should still win when they have a unique story.
source_ranking:
  official_domains:
    - "gov"
    - "gov.uk"
    - "europa.eu"
    - "fca.org.uk"
    - "bankofengland.co.uk"
    - "ecb.europa.eu"
    - "bis.org"
  tiers:
    - tier: 1
      domains:
        - "ft.com"
        - "reuters.com"
        - "bloomberg.com"
        - "apnews.com"
        - "wsj.com"
        - "economist.com"
    - tier: 2
      domains:
        - "bankingdive.com"
        - "finextra.com"
        - "pymnts.com"
        - "theblock.co"
        - "techcrunch.com"
        - "sifted.eu"
        - "crunchbase.com"
  default_tier: 3

# ============================================================================
# CURRENT INDUSTRY TRENDS
# ============================================================================
# These provide context to agents for better story selection and analysis.
# Trends are sorted by weight (highest first) for readability; the agent
# also sorts by weight before injecting into the prompt.
# Weights express structural editorial importance, not story quotas. Do not
# repeat a theme simply because its weight is high.
#
# WEIGHT RUBRIC (calibrate against this — don't grade-inflate):
#   10 = redefining the industry RIGHT NOW (max 1 trend at a time)
#    8 = top-of-mind for every payments operator (max 3 trends)
#    7 = important context, watching closely (max 5 trends)
#    6 = on the radar, real but not central (no cap)
#    5 = background trend, lower editorial heat
#    1-4 = sunsetting / archival
#
# REQUIRED FIELDS per trend:
#   name, weight, description, signals, companies_to_watch, watch_for,
#   last_reviewed (YYYY-MM-DD), added (YYYY-MM-DD), status (active|sunsetting|archived)
#
# SIGNALS RULE: keep each signal to ≤4 words. Long descriptive phrases
# ("declining guest checkout preference") will not regex-match news copy
# and dilute attention in the agent prompt. Use short keywords that
# actually appear in articles.
#
# CHANGE PROCEDURE: any edit to current_trends MUST include
# `trend_diff.py` output in the PR description. Run:
#   python ai/scripts/trend_diff.py --old git:main --new ai/config.yml
# ============================================================================
trend_radar:
  as_of: "2026-10-27"
  review_frequency: monthly
  weight_semantics: "structural editorial importance, not story quotas"

current_trends:
  - name: "Stablecoins, Tokenized Money & Settlement"
    weight: 8
    last_reviewed: "2026-10-27"
    added: "2026-04-26"
    status: active
    description: "Stablecoins are moving beyond crypto-native activity into commercial payments, treasury, payouts, and programmable settlement. US rulemaking is under way under the GENIUS Act while MiCA shapes the European market. Judge adoption by recurring payment usage, economics, and interoperability rather than issuance or announced pilots."
    signals:
      - "stablecoin"
      - "stablecoin settlement"
      - "deposit token"
      - "GENIUS Act"
      - "stablecoin cards"
    companies_to_watch:
      - "Circle"
      - "Tether"
      - "Stripe / Bridge"
      - "PayPal"
    watch_for: "Production volumes and recurring use cases; issuer licensing; bank deposit tokens versus nonbank stablecoins; stablecoin-funded cards; merchant adoption; reserve economics; settlement costs; and integration with or displacement of traditional rails."

  - name: "Real-Time Payments & Cross-Border Infrastructure"
    weight: 8
    last_reviewed: "2026-10-27"
    added: "2026-04-26"
    status: active
    description: "Instant-payment systems are mature or scaling across major markets. Competition is shifting toward interoperability, recurring payments, request-to-pay, fraud controls, liquidity, and cross-border connectivity. ISO 20022 and payment-system upgrades enable richer data and automation, but speed and cost claims require corridor-level evidence."
    signals:
      - "real-time payments"
      - "instant payments"
      - "SEPA Instant"
      - "FedNow"
      - "Pix Automático"
    companies_to_watch:
      - "NPCI"
      - "SWIFT"
      - "Wise"
      - "Airwallex"
    watch_for: "Active usage and recurring-payment functionality; UPI and Pix expansion; payment-system interoperability; instant-payment rules; cross-border speed and cost by corridor; ISO 20022 implementation; and bank or fintech multi-rail orchestration."

  - name: "Payment Fraud, Trust & Digital Identity"
    weight: 8
    last_reviewed: "2026-10-27"
    added: "2026-10-27"
    status: active
    description: "Fraud prevention and authentication directly affect payment cost, conversion, and regulation. Instant rails reduce intervention time, while APP-scam reimbursement, verification of payee, passkeys, tokenization, digital identity, and AI-enabled detection are redistributing responsibility across consumers, banks, networks, and merchants."
    signals:
      - "APP fraud"
      - "scam reimbursement"
      - "verification of payee"
      - "fraud losses"
      - "deepfake fraud"
    companies_to_watch:
      - "Visa"
      - "Mastercard"
      - "Feedzai"
      - "Featurespace"
    watch_for: "Fraud-loss rates; reimbursement outcomes; liability allocation; passkey and digital-identity adoption; false-positive rates; real-time controls; agent authentication; and merchant fraud economics."

  - name: "Merchant Acquiring & Payment Orchestration"
    weight: 7
    last_reviewed: "2026-10-27"
    added: "2026-04-26"
    status: active
    description: "Merchant payment providers are expanding across online acquiring, in-person acceptance, issuing, orchestration, lending, payouts, and embedded merchant banking. Unified commerce combines channels, data, and settlement while orchestration seeks better authorization performance and routing control. Economics and reliability matter more than feature breadth alone."
    signals:
      - "merchant acquiring"
      - "payment orchestration"
      - "authorization optimization"
      - "unified commerce"
      - "acquiring"
    companies_to_watch:
      - "Stripe"
      - "Adyen"
      - "Checkout.com"
      - "Worldpay"
    watch_for: "Direct acquiring expansion; online-to-POS convergence; orchestration adoption; measured authorization improvements; pricing pressure; profitability and take rates; payment optimization; and processor M&A."

  - name: "Digital Wallets & Checkout Competition"
    weight: 7
    last_reviewed: "2026-10-27"
    added: "2026-04-26"
    status: active
    description: "Digital wallets lead global ecommerce by transaction value. Competition is shifting from wallet availability toward merchant conversion, authentication, repeat use, distribution, and the underlying funding rail. Card-backed wallets, account-to-account wallets, and ecosystem super-apps have different economics and adoption patterns."
    signals:
      - "digital wallet"
      - "express checkout"
      - "branded checkout"
      - "wallet conversion"
      - "passkey checkout"
    companies_to_watch:
      - "PayPal"
      - "Apple"
      - "Google"
      - "Stripe"
    watch_for: "Branded-checkout growth versus overall wallet growth; online and physical-commerce adoption; measured merchant conversion; wallet monetization and funding mix; passkey adoption; distribution partnerships; and shifts from stored cards toward tokenized credentials."

  - name: "Banking Licences, Regulation & Market Access"
    weight: 7
    last_reviewed: "2026-10-27"
    added: "2026-04-26"
    status: active
    description: "Fintech expansion increasingly depends on licences, prudential and conduct requirements, and supervisory-grade controls. Banking licences can deepen deposits, lending, and primary-account relationships, while payment firms pursue direct acquiring and other infrastructure permissions. Regulatory capability can be both a moat and a growth constraint."
    signals:
      - "bank charter"
      - "banking licence"
      - "banking license"
      - "OCC conditional approval"
      - "direct acquiring licence"
    companies_to_watch:
      - "Revolut"
      - "Nubank"
      - "Monzo"
      - "Checkout.com"
    watch_for: "Approval versus operational launch; capital and compliance requirements; supervisory reviews; national expansion; US charter applications; EU payments legislation; cross-border licensing; and effects on profitability and competitive barriers."

  - name: "Open Banking & Embedded Finance Infrastructure"
    weight: 6
    last_reviewed: "2026-10-27"
    added: "2026-04-26"
    status: active
    description: "Open banking and embedded finance support account connectivity, payment initiation, verification, and financial distribution, but commercial development remains uneven. US CFPB Section 1033 compliance dates are stayed while the rule is reconsidered. Sustainable value depends on API reliability, data quality, regulatory access, adoption, and margins."
    signals:
      - "open banking"
      - "pay by bank"
      - "CFPB 1033"
      - "financial data rights"
      - "account-to-account payments"
    companies_to_watch:
      - "Plaid"
      - "TrueLayer"
      - "Tink"
      - "Trustly"
    watch_for: "Publication and substance of a revised US data-access rule; PSD3 and PSR; pay-by-bank adoption; enterprise API usage; pricing and margins; embedded-finance unit economics; consolidation; and measured card substitution at checkout."

  - name: "Agentic Commerce & Autonomous Payments"
    weight: 6
    last_reviewed: "2026-10-27"
    added: "2026-10-27"
    status: active
    description: "AI agents are beginning to initiate commerce and payment workflows under delegated authority. Commerce protocols, agent authentication, and financial APIs aim to support automated checkout, invoices, transfers, and treasury. The market remains early, so announced integrations and pilots must be separated from repeatable production usage."
    signals:
      - "agentic commerce"
      - "agentic payments"
      - "Universal Commerce Protocol"
      - "Agent Payments Protocol"
      - "Trusted Agent Protocol"
    companies_to_watch:
      - "Stripe"
      - "Visa"
      - "Mastercard"
      - "Google"
    watch_for: "Production transaction volume; merchant integrations; protocol interoperability; liability for agent errors; delegated identity and approval; spending controls; agent-operated business payments; and fraud prevention."

  - name: "BNPL & Embedded Credit"
    weight: 6
    last_reviewed: "2026-10-27"
    added: "2026-04-26"
    status: active
    description: "BNPL is becoming a regulated component of consumer credit, with broader wallet distribution and longer-duration products. Those products increase underwriting, funding, and loss sensitivity. Embedded-capital products also use payment data to connect merchant activity with financing decisions."
    signals:
      - "buy now pay later"
      - "pay in four"
      - "BNPL regulation"
      - "checkout financing"
      - "embedded lending"
    companies_to_watch:
      - "PayPal"
      - "Klarna"
      - "Affirm"
      - "Block / Afterpay"
    watch_for: "Regulatory implementation; delinquencies and loss rates; funding economics; longer-term financing adoption; wallet distribution; measured merchant conversion; and embedded-capital growth."
